<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>ด่านที่ 3: กระจกเงาตีบท</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; text-align: center; background-color: #f4ecf7; color: #333; padding: 20px; }
        .game-box { background-color: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 700px; margin: auto; }
        #canvas { border: 4px solid #8e44ad; border-radius: 10px; margin-top: 15px; background-color: #000; width: 100%; max-width: 400px;}
        .btn { padding: 12px 25px; font-size: 18px; font-weight: bold; background-color: #8e44ad; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-bottom: 15px;}
        .btn:hover { background-color: #732d91; }
        
        /* สไตล์สำหรับกล่องภารกิจ */
        .mission-box { background-color: #fdf2e9; padding: 15px; border-radius: 10px; margin-top: 15px; text-align: left; border: 2px solid #e67e22; }
        .mission-title { font-size: 20px; font-weight: bold; color: #d35400; margin-bottom: 10px; text-align: center;}
        .mission-list { list-style-type: none; padding: 0; font-size: 18px; line-height: 1.8; }
        .mission-list li { padding: 5px 10px; border-radius: 5px; }
        .active-mission { background-color: #fdebd0; font-weight: bold; border-left: 5px solid #e67e22; }

        #status-bar { margin-top: 20px; font-size: 22px; font-weight: bold; padding: 15px; border-radius: 8px; background-color: #f1c40f; color: #fff; }
        .progress-bar { width: 100%; background-color: #e0e0e0; border-radius: 8px; margin-top: 15px; overflow: hidden; height: 25px; display: none; }
        .progress-fill { height: 100%; background-color: #2ecc71; width: 0%; transition: width 0.1s; }
    </style>
</head>
<body>
    <div class="game-box">
        <h2 style="color: #8e44ad;">ด่านที่ 3: กระจกเงาตีบท</h2>
        <p>จงแสดงภาษาท่าทางให้ถูกต้องตามลำดับ ค้างไว้จนหลอดพลังเต็ม เพื่อปลดล็อกพลัง!</p>
        
        <button class="btn" type="button" onclick="init()" id="startBtn">เปิดกระจกเงา (กล้อง)</button>
        
        <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;">
            <div><canvas id="canvas" width="500" height="500"></canvas></div>
            
            <div class="mission-box">
                <div class="mission-title">📜 ภารกิจร่ายรำ</div>
                <ul class="mission-list" id="mission-list">
                    <li id="mission-0">⬜ ท่ารัก</li>
                    <li id="mission-1">⬜ ท่าโกรธ</li>
                    <li id="mission-2">⬜ ท่าตัวเรา</li>
                    <li id="mission-3">⬜ ท่าร้องไห้</li>
                    <li id="mission-4">⬜ ท่ายิ้ม</li>
                    <li id="mission-5">⬜ ท่าปฏิเสธ</li>
                </ul>
            </div>
        </div>
        
        <div class="progress-bar" id="progressContainer">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="status-bar">สถานะ: รอการเปิดกล้อง...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    
    <script type="text/javascript">
        // ลิงก์โมเดลของคุณครู
        const URL = "https://teachablemachine.withgoogle.com/models/1jrJKozUn/";
        
        // ลำดับท่าทางที่ต้องการให้ทำ (ชื่อต้องตรงกับที่สอน AI เป๊ะๆ)
        const targetPoses = [
            "ท่ารัก",
            "ท่าโกรธ",
            "ท่าตัวเรา",
            "ท่าร้องไห้",
            "ท่ายิ้ม",
            "ท่าปฏิเสธ"
        ];
        
        let currentPoseIndex = 0; // ตัวแปรเก็บว่าถึงท่าที่เท่าไหร่แล้ว
        let model, webcam, ctx, maxPredictions;
        let passTimer = 0; 
        const requiredFrames = 35; // ระยะเวลาค้างท่า (ประมาณ 1.5 - 2 วินาที)

        async function init() {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('status-bar').innerText = "กำลังโหลดระบบ AI...";
            document.getElementById('status-bar').style.backgroundColor = "#f39c12";
            
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            try {
                model = await tmPose.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                const size = 500;
                const flip = true; 
                webcam = new tmPose.Webcam(size, size, flip); 
                await webcam.setup(); 
                await webcam.play();
                window.requestAnimationFrame(loop);

                const canvas = document.getElementById("canvas");
                ctx = canvas.getContext("2d");
                
                document.getElementById('progressContainer').style.display = 'block';
                updateMissionUI(); // ไฮไลท์ท่าแรกที่ต้องทำ
                
            } catch (e) {
                alert("เกิดข้อผิดพลาดในการโหลดโมเดล โปรดตรวจสอบลิงก์ URL หรืออินเทอร์เน็ต");
            }
        }

        async function loop(timestamp) {
            webcam.update(); 
            await predict(); 
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
            const prediction = await model.predict(posenetOutput);

            // ถ้ารำครบทุกท่าแล้ว ให้หยุดการเช็ค
            if (currentPoseIndex >= targetPoses.length) {
                drawPose(pose);
                return; 
            }

            let isDoingCorrectPose = false;
            let currentTargetClass = targetPoses[currentPoseIndex];

            // วนลูปตรวจหาว่ากำลังทำท่าที่เป็น "เป้าหมายปัจจุบัน" อยู่หรือไม่
            for (let i = 0; i < maxPredictions; i++) {
                // เช็คความแม่นยำต้องเกิน 80% ขึ้นไป
                if (prediction[i].className === currentTargetClass && prediction[i].probability > 0.80) {
                    isDoingCorrectPose = true;
                }
            }

            const statusDiv = document.getElementById("status-bar");
            const progressFill = document.getElementById("progressFill");

            if (isDoingCorrectPose) {
                passTimer++;
                
                let percent = (passTimer / requiredFrames) * 100;
                progressFill.style.width = percent + "%";
                statusDiv.innerHTML = "พลังกำลังเชื่อมต่อ... ค้างท่าไว้!";
                statusDiv.style.backgroundColor = "#e67e22";

                // เมื่อทำค้างไว้จนครบเวลาที่กำหนด
                if (passTimer >= requiredFrames) {
                    // เปลี่ยนสถานะในรายการเป็นทำสำเร็จ ✅
                    document.getElementById("mission-" + currentPoseIndex).innerHTML = "✅ " + currentTargetClass;
                    document.getElementById("mission-" + currentPoseIndex).classList.remove("active-mission");
                    
                    // ขยับไปท่าต่อไป
                    currentPoseIndex++;
                    passTimer = 0; // รีเซ็ตหลอดพลัง
                    progressFill.style.width = "0%";

                    if (currentPoseIndex < targetPoses.length) {
                        updateMissionUI(); // อัปเดต UI ให้ไฮไลท์ท่าต่อไป
                    } else {
                        // ครบทุกท่าแล้ว
                        statusDiv.innerHTML = "🎉 สำเร็จ! คุณปลดล็อกพลังร่ายรำครบทุกท่าแล้ว (ผ่านด่าน)";
                        statusDiv.style.backgroundColor = "#27ae60";
                        progressFill.style.width = "100%";
                    }
                }
            } else {
                // หากหลุดท่า หรือกล้องจับเจอ "BG พื้นหลัง" หลอดพลังจะลดลง/รีเซ็ต
                if (passTimer > 0) {
                    passTimer = 0; 
                    progressFill.style.width = "0%";
                    statusDiv.innerHTML = "กำลังรอท่า: " + currentTargetClass;
                    statusDiv.style.backgroundColor = "#c0392b";
                }
            }

            drawPose(pose);
        }

        function updateMissionUI() {
            if(currentPoseIndex < targetPoses.length) {
                let currentMissionId = "mission-" + currentPoseIndex;
                document.getElementById(currentMissionId).classList.add("active-mission");
                
                // ตัดคำว่า "Class X " ออกเพื่อแสดงผลให้ดูดีขึ้น
                let displayName = targetPoses[currentPoseIndex].replace(/Class \d+ /, "");
                document.getElementById('status-bar').innerText = "กำลังรอท่า: " + displayName;
                document.getElementById('status-bar').style.backgroundColor = "#3498db";
            }
        }

        function drawPose(pose) {
            if (webcam.canvas) {
                ctx.drawImage(webcam.canvas, 0, 0);
                if (pose) {
                    const minPartConfidence = 0.5;
                    tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
                    tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
                }
            }
        }
    </script>
</body>
</html>
